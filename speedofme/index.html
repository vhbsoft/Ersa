<html>
<head>
<script src="http://speedof.me/api/api.js" type="text/javascript"></script>
</head>
<body>
<h2>SpeedOf.Me API Consumer - Sample Page</h2>
<button id="btnStart" type="button" onclick="btnStartClick()"><h3>Start Test</h3></button>
<button id="sendInfo" type="button" onclick="sendMockInfoClick()"><h3>Test Send Info</h3></button>
<div id="msg"></div>
<script type="text/javascript">
    apiKeys = [''] // API Keys here
    randomIdx = Math.floor(Math.random() * apiKeys.length);
    pickedKey = apiKeys[randomIdx];
    console.log("using apiKey: " + pickedKey);
    SomApi.account = pickedKey;
    SomApi.domainName = "localhost"; 
    SomApi.config.sustainTime = 4;
    SomApi.onTestCompleted = onTestCompleted;
    SomApi.onError = onError;
    var msgDiv = document.getElementById("msg");
    setTimeout(btnStartClick, 5000);
function btnStartClick() {
    msgDiv.innerHTML = "<h3>Speed test in progress. Please wait...</h3>";
    SomApi.startTest();
}
function sendMockInfoClick() {
    var mockResult = {
      latency: 30,
      jitter: 39,
      download: 408.69,
      upload: 162.06,
      maxDownload: 415.55,
      maxUpload: 211.51,
      testServer: 'San Jose 5',
      ip_address: '162.237.77.152',
      hostname: '162-237-77-152.lightspeed.sntcca.sbcglobal.net',
      userAgent: 'Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:124.0) Gecko/20100101 Firefox/124.0',
      testDate: '2024-04-28T22:55:52.055Z'
    };
    sendInfoClick(mockResult);
}
function sendInfoClick(testResult) {
    fetch("/results", {
        method: "POST",
        body: JSON.stringify({
            testResult
        }),
        headers: {
            "Content-type": "application/json; charset=UTF-8"
        }
    });
}
function onTestCompleted(testResult) {
    msgDiv.innerHTML =
    "<h3>"+
    "Download: " +testResult.download +"Mbps <br/>"+
    "Upload: " +testResult.upload +"Mbps <br/>"+
    "Latency: " +testResult.latency +"ms <br/>"+
    "Jitter: " +testResult.jitter +"ms <br/>"+
    "Test Server: "+testResult.testServer +"<br/>"+
    "IP: " +testResult.ip_address +"<br/>"+
    "Hostname: " +testResult.hostname +"<br/>"+
    "</h3>";
    sendInfoClick(testResult);
}
function onError(error) {
msgDiv.innerHTML = "Error "+ error.code + ": "+error.message;
}
</script>
</body>
</html>
